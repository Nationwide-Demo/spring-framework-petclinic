spring:
  application:
    name: visits-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/visits}
    username: ${SPRING_DATASOURCE_USERNAME:petclinic}
    password: ${SPRING_DATASOURCE_PASSWORD:petclinic}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: ${DB_SCHEMA:public}
  flyway:
    locations: classpath:db/migration
    # In AWS every service owns a schema inside one Aurora cluster
    schemas: ${DB_SCHEMA:public}
    default-schema: ${DB_SCHEMA:public}
    create-schemas: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      # In ECS this points at the ADOT sidecar, which forwards spans to AWS X-Ray
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    org.springframework.samples.petclinic: INFO
