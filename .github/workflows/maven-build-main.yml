name: CI on main branch

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build, test and publish images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

      # Everything below needs an AWS account. Configure these repository variables and
      # an OIDC deploy role to enable publishing:
      #   AWS_REGION, AWS_DEPLOY_ROLE_ARN, ECR_REGISTRY, FRONTEND_BUCKET, CLOUDFRONT_DISTRIBUTION_ID
      - name: Configure AWS credentials
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push service images to ECR
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        run: ./mvnw -B -DskipTests package jib:build -Ddocker.registry=${{ vars.ECR_REGISTRY }} -Ddocker.image.prefix=petclinic

      - name: Publish the SPA to S3 and invalidate CloudFront
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        run: |
          aws s3 sync frontend/dist "s3://${{ vars.FRONTEND_BUCKET }}" --delete
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths '/*'
