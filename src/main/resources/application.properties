spring.application.name=petclinic
spring.profiles.default=h2

# JPA / Hibernate: the schema is created by the SQL scripts below, not by Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.sql.init.mode=always

# Validation messages
spring.messages.basename=messages/messages

# Caching of the vets lookup (see ClinicServiceImpl#findVets)
spring.cache.cache-names=vets

# Readiness / liveness probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

logging.level.org.springframework.samples.petclinic=debug
