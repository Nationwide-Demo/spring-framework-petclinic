spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: customers-service
              uri: ${petclinic.services.customers}
              predicates:
                - Path=/api/customer/**
              filters:
                - StripPrefix=2
            - id: vets-service
              uri: ${petclinic.services.vets}
              predicates:
                - Path=/api/vet/**
              filters:
                - StripPrefix=2
            - id: visits-service
              uri: ${petclinic.services.visits}
              predicates:
                - Path=/api/visit/**
              filters:
                - StripPrefix=2
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: ${ALLOWED_ORIGINS:http://localhost:5173}
                allowed-methods: [GET, POST, PUT, DELETE, OPTIONS]
                allowed-headers: '*'

petclinic:
  services:
    customers: ${CUSTOMERS_SERVICE_URL:http://localhost:8081}
    vets: ${VETS_SERVICE_URL:http://localhost:8082}
    visits: ${VISITS_SERVICE_URL:http://localhost:8083}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5
    instances:
      visits-service:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 2s
    instances:
      visits-service:
        baseConfig: default

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    org.springframework.samples.petclinic: INFO
